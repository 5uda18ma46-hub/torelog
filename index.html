    g2.appendChild(el("div", "row",
      '<span class="main"><span class="t" style="font-variant-numeric:tabular-nums">' + line +
      '</span><span class="s">筋肥大の目安は週10〜16セット</span></span>'));

    var add = el("button", "primary", "＋ この日に種目を追加");
    add.addEventListener("click", function () { push("exerciseList", { pick: "program", programId: prog.id }); });
    appEl.appendChild(add);

    /* 種目選択から戻ってきたとき用 */
    S.programPick = prog.id;
  }

  function viewData() {
    nav("バックアップと復元");
    var json = JSON.stringify(exportAll(), null, 2);

    var p = group("書き出し", null, "このJSONを保存しておけば、端末を変えても復元できます");
    var ta = el("textarea", "json");
    ta.value = json; ta.readOnly = true;
    var w = el("div", "row"); w.style.display = "block"; w.appendChild(ta);
    p.appendChild(w);

    var btns = el("div", "rowbtns");
    var copy = el("button", "ghost", "コピー");
    copy.addEventListener("click", function () {
      ta.select();
      try { document.execCommand("copy"); toast("コピーしました"); }
      catch (e) { toast("コピーできませんでした"); }
    });
    var dl = el("button", "ghost", "ファイルに保存");
    dl.addEventListener("click", function () {
      try {
        var blob = new Blob([json], { type: "application/json" });
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "workout-log-" + dateKey(new Date()) + ".json";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      } catch (e) { toast("この環境では保存できません。コピーを使ってください"); }
    });
    btns.appendChild(copy); btns.appendChild(dl);
    appEl.appendChild(btns);

    var p2 = group("読み込み", null, "書き出したJSONを貼り付けて取り込みます。今のデータは上書きされます");
    var ta2 = el("textarea", "json");
    ta2.placeholder = "ここにJSONを貼り付ける";
    var w2 = el("div", "row"); w2.style.display = "block"; w2.appendChild(ta2);
    p2.appendChild(w2);
    var imp = el("button", "primary", "取り込む");
    imp.addEventListener("click", function () { importAll(ta2.value); });
    appEl.appendChild(imp);

    var p3 = group("その他");
    var demo = el("button", "ghost", "サンプルデータを入れる");
    demo.style.flex = "none";
    demo.addEventListener("click", seedDemo);
    appEl.appendChild(demo);
    var reset = el("button", "danger", "すべて消して初期状態に戻す");
    reset.addEventListener("click", function () {
      if (!confirm("すべての記録を削除します。取り消せません。")) return;
      Object.keys(K).forEach(function (k) { localStorage.removeItem(K[k]); });
      load(); S.stack = []; S.tab = "home"; render();
      toast("初期状態に戻しました");
    });
    appEl.appendChild(reset);
  }

  function exportAll() {
    return {
      app: "workout-log", schemaVersion: DB.meta.schemaVersion,
      exportedAt: new Date().toISOString(),
      meta: DB.meta, settings: DB.settings, exercises: DB.exercises,
      programs: DB.programs, sessions: DB.sessions, bodyLogs: DB.bodyLogs
    };
  }
  function importAll(text) {
    var d;
    try { d = JSON.parse(text); } catch (e) { toast("JSONとして読めませんでした"); return; }
    if (d.app !== "workout-log") { toast("このアプリのバックアップではありません"); return; }
    if (d.schemaVersion > SCHEMA) { toast("新しいバージョンのデータです。アプリを更新してください"); return; }
    if (!confirm("今のデータを上書きします。よろしいですか？")) return;
    DB.settings = Object.assign(clone(DEFAULT_SETTINGS), d.settings || {});
    DB.exercises = d.exercises || clone(PRESET_EXERCISES);
    DB.programs = d.programs || clone(PRESET_PROGRAMS);
    DB.sessions = d.sessions || [];
    DB.bodyLogs = d.bodyLogs || [];
    DB.active = null;
    ["settings", "exercises", "programs", "sessions", "bodyLogs", "active"].forEach(save);
    S.stack = []; S.tab = "home"; render();
    toast("取り込みました");
  }

  /* --- サンプルデータ --- */
  function seedDemo() {
    if (DB.sessions.length && !confirm("既存の記録にサンプルを追加します。よろしいですか？")) return;
    var bw = 58.0;
    for (var k = 11; k >= 0; k--) {
      var prog = progById(k % 2 === 1 ? "prog_a" : "prog_b");
      var idx = Math.floor((11 - k) / 2);
      var d = new Date(); d.setDate(d.getDate() - Math.round(k * 3.5));
      var stall = [0, 1, 1, 2, 3, 3];
      var s = {
        id: rid("ses"), programId: prog.id, date: dateKey(d),
        startedAt: new Date(d.getTime() + 19 * 3600000).toISOString(),
        endedAt: new Date(d.getTime() + 19 * 3600000 + 82 * 60000).toISOString(),
        bodyWeightAtTime: Math.round((bw + idx * 0.2) * 10) / 10, note: "",
        exercises: prog.items.map(function (it, pos) {
          var e = exById(it.exerciseId);
          var mult = stall[Math.min(5, idx + (pos % 2))];
          var base = e.defaultWeight * 0.85 + e.step * 2 * mult;
          var w = e.metric === "time" || e.metric === "bodyweight_reps" ? 0
            : Math.max(e.step, Math.round(base / (e.step || 1)) * (e.step || 1));
          var sets = [];
          for (var i = 0; i < it.targetSets; i++) {
            var r = e.repHi - (i >= 2 ? 1 : 0) - (i >= 3 ? 1 : 0);
            sets.push({ weight: w, reps: Math.max(e.repLo, r), loggedAt: new Date(d).toISOString() });
          }
          return {
            exerciseId: e.id,
            snapshot: { name: e.name, part: e.part, metric: e.metric, repLo: e.repLo, repHi: e.repHi, restSec: e.restSec },
            plannedSets: it.targetSets, sets: sets, skipped: false
          };
        })
      };
      DB.sessions.push(s);
    }
    for (var j = 7; j >= 0; j--) {
      var wd = new Date(); wd.setDate(wd.getDate() - j * 7);
      DB.bodyLogs.push({ date: dateKey(wd), weight: Math.round((58.0 + (7 - j) * 0.15) * 10) / 10 });
    }
    save("sessions"); save("bodyLogs");
    S.stack = []; render();
    toast("サンプルデータを入れました");
  }

  /* =========================================================
     11. 起動
     ========================================================= */
  function applyTheme() {
    var t = DB.settings.theme;
    if (t === "system") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
  }

  /* 種目選択から戻ったときにプログラムへ追加する */
  function handleProgramPick(exerciseId) {
    var prog = progById(S.programPick);
    if (!prog) return false;
    prog.items.push({ exerciseId: exerciseId, targetSets: 3 });
    save("programs");
    return true;
  }
  /* exerciseList からの選択を用途で振り分ける */
  var _viewExerciseList = viewExerciseList;
  viewExerciseList = function (opt) {
    if (opt && opt.pick === "program") {
      nav("種目を追加");
      var lp = group("種目マスタ");
      DB.exercises.filter(function (e) { return !e.archived; }).forEach(function (e) {
        rowBtn(lp, esc(e.name), PART_LABEL[e.part] + " ・ " + GEAR_LABEL[e.gear], "", function () {
          handleProgramPick(e.id);
          pop();
        });
      });
      return;
    }
    _viewExerciseList(opt);
  };

  load();
  applyTheme();
  render();

  /* 経過時間の更新 */
  setInterval(function () {
    if (here().name === "home" && DB.active) {
      var m = appEl.querySelector(".next-meta b");
      if (m) m.textContent = elapsed(DB.active.startedAt);
    }
  }, 1000);

  window.addEventListener("beforeunload", function () {
    if (DB.active) save("active");
  });
})();
</script>
